<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#0d825c"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="40" y1="6" x2="56" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo redondeado esmeralda -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Alimentos e insumos en la despensa -->
  <g filter="url(#shadow)">
    <!-- Alimento / Manzana izquierda -->
    <circle cx="24" cy="22" r="7.5" fill="#f59e0b"/>
    <path d="M25 15C25.5 12.5 28 12 28.5 12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Pan / Hogaza centro -->
    <ellipse cx="34" cy="21" rx="8" ry="6.5" fill="#fde68a"/>
    <path d="M31 18L33 24M35 18L37 24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Canasta / Caja de alimentos Despensa -->
    <path d="M12 28H52L46.5 50.5C46 52.5 44 54 42 54H22C20 54 18 52.5 17.5 50.5L12 28Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 28H54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Ranuras de la canasta -->
    <path d="M21 36H43" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M24 44H40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <!-- Insignia Despensa+ (Badge Dorada Superior) -->
  <g filter="url(#shadow)">
    <circle cx="48" cy="16" r="11" fill="url(#plusGrad)" stroke="#ffffff" stroke-width="2"/>
    <path d="M48 10.5V21.5M42.5 16H53.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>